<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!--FONTS-->
<style>
  :root {
    --bg: #f3f2ee; --panel: #ffffff; --ink: #1d1f24; --muted: #646872; --line: #dddbd4; --chip: #ecebe6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #141518; --panel: #1d1f23; --ink: #eceae6; --muted: #9ca0a8; --line: #31343a; --chip: #2a2d32; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #141518; --panel: #1d1f23; --ink: #eceae6; --muted: #9ca0a8; --line: #31343a; --chip: #2a2d32; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 28px 16px 56px; }
  header h1 { margin: 0 0 4px; font-size: 26px; line-height: 1.2; }
  header p { margin: 0; color: var(--muted); }
  .status { margin: 14px 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 18px; margin-top: 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .still { aspect-ratio: {{W}} / {{H}}; background: var(--chip); display: grid; place-items: center; color: var(--muted); }
  .still img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .meta { padding: 12px 14px 14px; display: grid; gap: 8px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .head b { font-size: 16px; }
  .head span { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .text { font-weight: 600; background: var(--chip); border-radius: 8px; padding: 6px 10px; }
  dl { margin: 0; display: grid; grid-template-columns: 72px 1fr; gap: 4px 10px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  section.assume { margin-top: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; }
  section.assume h2 { margin: 0 0 6px; font-size: 17px; }
  section.assume ul { margin: 0; padding-left: 20px; }
  .err { margin-top: 16px; background: #b3261e; color: #fff; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; display: none; }
  canvas#c { position: absolute; left: -99999px; top: 0; width: {{W}}px; height: {{H}}px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Storyboard</h1>
    <p id="sub"></p>
    <p id="status" class="status">Loading the scene…</p>
  </header>
  <div id="grid" class="grid"></div>
  <section id="assume" class="assume" hidden>
    <h2>Facts and numbers assumed</h2>
    <ul id="assumeList"></ul>
  </section>
  <div id="err" class="err"></div>
</main>
<canvas id="c" width="{{W}}" height="{{H}}"></canvas>

<script type="module">
  // three.js r187, vendored inline below by tools/vendor-three.mjs: no CDN, works offline
<!--THREE-->
  const $ = (id) => document.getElementById(id);
  const fail = (msg) => { window.STAGE_ERROR = String(msg); $('err').textContent = String(msg); $('err').style.display = 'block'; $('status').textContent = 'Failed to render.'; };
  window.addEventListener('error', (e) => fail((e.error && e.error.stack) || e.message));
  window.addEventListener('unhandledrejection', (e) => fail((e.reason && e.reason.stack) || e.reason));
  // the kits and the style run here, inside this one module: no import map and no injected scripts, which a sandboxed page may refuse
<!--KIT_STAGE-->
<!--KIT_EXTRA-->
<!--STYLE-->

  const style = window.STYLES[window.STYLES.length - 1];
  if (!style) throw new Error('style.js did not call registerStyle()');
  const sb = style.storyboard || {};
  const beats = sb.beats || [];
  if (!beats.length) throw new Error('style.storyboard.beats is empty: add one entry per beat');
  const params = new URLSearchParams(location.search);
  const N = Math.max(1, +(params.get('samples') || sb.samples || 16));
  const fmt = (x) => (+x).toFixed(1) + 's';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  $('title').textContent = style.topic || style.name || 'Storyboard';
  $('sub').textContent = `${style.name || ''} · ${beats.length} beats · ${fmt(style.duration || 0)}`;
  const imgs = beats.map((b, i) => {
    const el = document.createElement('article'); el.className = 'panel';
    el.innerHTML = `<div class="still">Rendering…</div>
      <div class="meta">
        <div class="head"><b>Beat ${i + 1}</b><span>${fmt(b.start)}–${fmt(b.end)} · still at ${fmt(b.at)}</span></div>
        <div class="text">${b.text ? '“' + esc(b.text) + '”' : '<span style="color:var(--muted)">No on-screen text</span>'}</div>
        <dl><dt>Change</dt><dd>${esc(b.change)}</dd><dt>Camera</dt><dd>${esc(b.camera)}</dd><dt>Sound</dt><dd>${esc(b.sound)}</dd></dl>
      </div>`;
    $('grid').appendChild(el);
    return el.querySelector('.still');
  });
  if ((sb.assumptions || []).length) {
    $('assume').hidden = false;
    $('assumeList').innerHTML = sb.assumptions.map((a) => `<li>${esc(a)}</li>`).join('');
  }

  const canvas = $('c');
  const S = await K.run(canvas, style, { samples: N, width: canvas.width, height: canvas.height });
  window.S = S; window.STYLE = style; window.DURATION = S.duration;
  window.seekN = (t, n) => S.seek(t, n);
  for (let i = 0; i < beats.length; i++) {
    $('status').textContent = `Rendering still ${i + 1} of ${beats.length} at ${N} samples…`;
    await new Promise((r) => requestAnimationFrame(() => r()));
    S.seek(beats[i].at, N);
    const img = new Image(); img.alt = `Beat ${i + 1} key frame`; img.src = canvas.toDataURL('image/jpeg', 0.9);
    imgs[i].replaceChildren(img);
  }
  $('status').textContent = `${beats.length} stills rendered at ${N} samples.`;
  window.STAGE_READY = true;
</script>
</body>
</html>
