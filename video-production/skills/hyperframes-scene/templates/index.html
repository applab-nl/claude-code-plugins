<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!-- Pin the exact GSAP version. Vendor it into assets/vendor/ if renders run offline. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- The root holds only scene hosts, media and audio. Length of the video = root data-duration. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="hero" data-composition-id="hero" data-composition-src="compositions/hero.html"
           data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics"
           data-width="1920" data-height="1080" style="z-index: 1"></div>
      <!-- Remove this line if there is no music file yet; a missing src fails check. -->
      <audio id="music" class="clip" src="assets/audio/music.mp3" data-start="0" data-duration="6"
             data-volume="0.4" data-fade-out="1" data-track-index="2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
